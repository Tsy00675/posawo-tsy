<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>แอปเยี่ยมบ้าน พอ.สว. ท่าสองยาง</title>
  <meta name="theme-color" content="#007a3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="เยี่ยมบ้าน พอ.สว.">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f4f9f6; color: #1e293b; -webkit-tap-highlight-color: transparent; }
    .moph-header { background: linear-gradient(135deg, #007a3d 0%, #006837 100%); }
    .moph-btn { background-color: #007a3d; color: #ffffff; }
    .moph-btn:hover { background-color: #006837; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="moph-header text-white shadow-md sticky top-0 z-30">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-white/15 border border-white/25 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-house-medical text-lg text-white"></i>
        </div>
        <div class="min-w-0">
          <h1 class="text-sm sm:text-base font-semibold truncate">เยี่ยมบ้านผู้ป่วย พอ.สว.</h1>
          <p id="hdr-org" class="text-[11px] text-green-100 truncate">สสอ.ท่าสองยาง จ.ตาก</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" id="btn-pwa-install" class="hidden text-[11px] bg-white text-[#006837] font-semibold px-2.5 py-1 rounded-full shadow-xs cursor-pointer">📲 ติดตั้ง</button>
        <span id="net-badge" class="text-[11px] font-medium px-2.5 py-1 rounded-full bg-white/15 border border-white/25">🟢 ออนไลน์</span>
      </div>
    </div>
  </header>

  <main class="max-w-2xl w-full mx-auto px-3.5 py-4 flex-1 space-y-3.5">

    <!-- Login Screen (PDPA Protected) -->
    <section id="sec-login" class="bg-white rounded-2xl shadow-sm border border-green-100 p-6 text-center mt-4">
      <div class="w-14 h-14 rounded-2xl bg-green-100 text-[#007a3d] flex items-center justify-center mx-auto mb-3">
        <i class="fa-solid fa-user-shield text-2xl"></i>
      </div>
      <h2 class="text-lg font-semibold text-slate-800">เข้าสู่ระบบทีมเยี่ยมบ้าน</h2>
      <p class="text-xs text-slate-500 mt-1 mb-4">กรุณากรอกรหัสผ่านเพื่อเข้าดูรายชื่อผู้ป่วยและบันทึกผลเยี่ยมบ้าน (ใช้งานออฟไลน์ได้หลังเข้าสู่ระบบตอนมีเน็ต 1 ครั้ง)</p>
      <form id="form-login" class="space-y-3">
        <input type="password" id="login-pass" required autocomplete="off" placeholder="รหัสผ่านผู้ดูแลระบบ" class="w-full text-center rounded-xl border border-slate-300 px-4 py-3 text-base focus:ring-2 focus:ring-[#007a3d] outline-none">
        <button type="submit" id="btn-login" class="w-full moph-btn font-medium py-3 rounded-xl shadow-sm transition cursor-pointer text-sm">
          เข้าสู่ระบบเยี่ยมบ้าน
        </button>
      </form>
    </section>

    <!-- Main Patient Visit App -->
    <section id="sec-app" class="hidden space-y-3.5">

      <!-- Offline Sync Queue Banner -->
      <div id="offline-sync-panel" class="hidden rounded-2xl bg-amber-50 border border-amber-200 p-3.5">
        <div class="flex items-center justify-between gap-2 mb-2">
          <div class="text-xs font-semibold text-amber-900">
            📦 ผลเยี่ยมค้างส่ง (<span id="offline-count">0</span> รายการ)
          </div>
          <button type="button" id="btn-sync-all" class="bg-[#007a3d] hover:bg-[#006837] text-white text-xs font-medium px-3.5 py-1.5 rounded-xl shadow-xs cursor-pointer">
            🔄 ซิงค์ขึ้นระบบ
          </button>
        </div>
        <div id="offline-list" class="space-y-1.5"></div>
      </div>

      <!-- Filter & Summary Card -->
      <div class="bg-white rounded-2xl shadow-sm border border-green-100 p-3.5 space-y-2.5">
        <div class="flex items-center justify-between gap-2">
          <div class="text-xs font-semibold text-[#006837]" id="app-round-label">กำลังโหลดรอบ...</div>
          <div class="flex items-center gap-1.5 flex-wrap">
            <button type="button" id="btn-add-patient" class="text-xs bg-[#007a3d] hover:bg-[#006837] text-white font-medium px-2.5 py-1 rounded-lg cursor-pointer">➕ ลงคนไข้ใหม่</button>
            <button type="button" id="btn-refresh" class="text-xs bg-green-50 text-[#007a3d] border border-green-200 px-2.5 py-1 rounded-lg cursor-pointer">🔄 รีเฟรช</button>
            <button type="button" id="btn-logout" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg cursor-pointer">ออก</button>
          </div>
        </div>

        <select id="filter-round" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-[#007a3d]"></select>

        <div class="grid grid-cols-3 gap-2 text-center">
          <button type="button" data-st="ALL" class="st-filter-btn rounded-xl border border-green-600 bg-[#007a3d] text-white py-1.5 text-xs font-medium cursor-pointer">
            ทั้งหมด (<span id="cnt-all">0</span>)
          </button>
          <button type="button" data-st="รอเยี่ยมบ้าน" class="st-filter-btn rounded-xl border border-amber-200 bg-amber-50 text-amber-800 py-1.5 text-xs font-medium cursor-pointer">
            รอเยี่ยม (<span id="cnt-wait">0</span>)
          </button>
          <button type="button" data-st="เยี่ยมแล้ว" class="st-filter-btn rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-800 py-1.5 text-xs font-medium cursor-pointer">
            เยี่ยมแล้ว (<span id="cnt-done">0</span>)
          </button>
        </div>

        <input type="text" id="filter-search" placeholder="🔍 ค้นหาชื่อผู้ป่วย / หมู่บ้าน / ตำบล..." class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-[#007a3d]">
      </div>

      <!-- Patient Cards List -->
      <div id="patient-cards" class="space-y-3 pb-8"></div>

    </section>

  </main>

  <script>
    var DEFAULT_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxArwxigN7ImXL6BYGxVQ6jx8mKTZIX-b7g933ucqyjlowyYuW3c2YZi89FF4pTOvwB/exec';
    var CACHE_DATA_KEY = 'pmmv_field_admin_v1';
    var CACHE_PASS_KEY = 'pmmv_field_pass_v1';
    var VISIT_QUEUE_KEY = 'pmmv_visit_offline_queue_v1';
    var ADMIN_PASSCODE = '';
    var ADMIN_DATA = null;
    var STATUS_FILTER = 'ALL';
    var DEFERRED_INSTALL_PROMPT = null;

    function toDriveThumb(url) {
      var s = String(url || '').trim();
      if (s.indexOf('data:image') === 0) return s;
      var m = s.match(/\/d\/([a-zA-Z0-9_-]+)/) || s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return m ? ('https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w400') : s;
    }

    function previewPhotoModal(src, origUrl) {
      Swal.fire({
        imageUrl: src,
        imageAlt: 'ภาพประกอบผู้ป่วย',
        showConfirmButton: true,
        confirmButtonText: 'ปิด',
        confirmButtonColor: '#007a3d',
        footer: origUrl && origUrl.indexOf('http') === 0 ? ('<a href="' + escapeHtml(origUrl) + '" target="_blank" style="color:#007a3d;font-size:12px;">เปิดภาพขนาดเต็มใน Google Drive</a>') : ''
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function encodePass(p) {
      try { return btoa(unescape(encodeURIComponent(String(p || '')))); } catch (e) { return String(p || ''); }
    }

    function formatErr(err) {
      if (!err) return 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
      if (typeof err === 'string') return err;
      return err.message || String(err);
    }

    function callApi(action, payload, onOk, onFail) {
      fetch(DEFAULT_GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: payload || {} })
      })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) { if (onOk) onOk(data); })
      .catch(function(err) { if (onFail) onFail(err); });
    }

    function updateNetBadge() {
      var b = document.getElementById('net-badge');
      if (!b) return;
      if (navigator.onLine) {
        b.className = 'text-[11px] font-medium px-2.5 py-1 rounded-full bg-white/15 border border-white/25';
        b.textContent = '🟢 ออนไลน์';
      } else {
        b.className = 'text-[11px] font-medium px-2.5 py-1 rounded-full bg-amber-400 text-amber-950 font-semibold';
        b.textContent = '🟠 ออฟไลน์';
      }
    }

    function unlockWithCache(pass) {
      try {
        var sp = localStorage.getItem(CACHE_PASS_KEY);
        var sd = localStorage.getItem(CACHE_DATA_KEY);
        if (!sp || !sd) return false;
        if (encodePass(pass) !== sp) return false;
        ADMIN_PASSCODE = pass;
        ADMIN_DATA = JSON.parse(sd);
        showApp();
        return true;
      } catch (e) {
        return false;
      }
    }

    function showApp() {
      document.getElementById('sec-login').classList.add('hidden');
      document.getElementById('sec-app').classList.remove('hidden');
      if (ADMIN_DATA && ADMIN_DATA.settings && ADMIN_DATA.settings.orgName) {
        document.getElementById('hdr-org').textContent = ADMIN_DATA.settings.orgName;
      }
      populateRounds();
      renderOfflineQueue();
      renderPatients();
    }

    function doLogin(e) {
      e.preventDefault();
      var pass = document.getElementById('login-pass').value;
      if (!navigator.onLine) {
        if (!unlockWithCache(pass)) {
          Swal.fire('เข้าออฟไลน์ไม่ได้', 'กรุณาล็อกอินตอนมีอินเทอร์เน็ตอย่างน้อย 1 ครั้งก่อนลงพื้นที่ (หรือตรวจสอบรหัสผ่าน)', 'warning');
        }
        return;
      }
      Swal.fire({ title: 'กำลังเข้าสู่ระบบ...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
      callApi('verifyAdmin', { passcode: pass }, function(res) {
        Swal.close();
        if (res && res.success) {
          ADMIN_PASSCODE = pass;
          ADMIN_DATA = res;
          try {
            localStorage.setItem(CACHE_PASS_KEY, encodePass(pass));
            localStorage.setItem(CACHE_DATA_KEY, JSON.stringify(res));
          } catch (err) {}
          showApp();
        } else {
          Swal.fire('รหัสผ่านไม่ถูกต้อง', (res && res.message) || 'กรุณาตรวจสอบรหัสผ่าน', 'error');
        }
      }, function(err) {
        Swal.close();
        if (!unlockWithCache(pass)) {
          Swal.fire('เกิดข้อผิดพลาด', formatErr(err), 'error');
        }
      });
    }

    function refreshData() {
      if (!navigator.onLine) {
        Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: '🟠 ขณะนี้ออฟไลน์ ใช้ข้อมูลในเครื่อง', timer: 2000, showConfirmButton: false });
        return;
      }
      Swal.fire({ title: 'กำลังอัปเดตข้อมูล...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
      callApi('verifyAdmin', { passcode: ADMIN_PASSCODE }, function(res) {
        Swal.close();
        if (res && res.success) {
          ADMIN_DATA = res;
          try { localStorage.setItem(CACHE_DATA_KEY, JSON.stringify(res)); } catch (err) {}
          populateRounds();
          renderPatients();
        }
      }, function(err) {
        Swal.close();
        Swal.fire('อัปเดตไม่สำเร็จ', formatErr(err), 'warning');
      });
    }

    function populateRounds() {
      var sel = document.getElementById('filter-round');
      if (!sel || !ADMIN_DATA) return;
      var rounds = ADMIN_DATA.rounds || [];
      var cur = sel.value;
      var opts = '<option value="ALL">ทุกรอบออกหน่วย</option>' + rounds.map(function(r) {
        return '<option value="' + escapeHtml(r.Round_ID) + '">รอบ ' + escapeHtml(r.Round_No) + ' (' + escapeHtml(r.Month_Label) + ') ' + escapeHtml(r.Location) + '</option>';
      }).join('');
      sel.innerHTML = opts;
      var openR = rounds.find(function(r) { return r.Status === 'เปิดรับลงทะเบียน'; });
      if (cur && rounds.some(function(r) { return r.Round_ID === cur; })) {
        sel.value = cur;
      } else if (openR) {
        sel.value = openR.Round_ID;
      }
      var lbl = document.getElementById('app-round-label');
      var activeR = rounds.find(function(r) { return r.Round_ID === sel.value; });
      if (lbl) lbl.textContent = activeR ? ('📍 ' + activeR.Location + ' ต.' + activeR.Subdistrict) : 'รายชื่อผู้ป่วยทั้งหมด';
    }

    function renderPatients() {
      var wrap = document.getElementById('patient-cards');
      var sel = document.getElementById('filter-round');
      var q = String(document.getElementById('filter-search').value || '').toLowerCase().trim();
      if (!wrap || !ADMIN_DATA) return;

      var roundId = sel ? sel.value : 'ALL';
      var byRound = (ADMIN_DATA.patients || []).filter(function(p) {
        return roundId === 'ALL' || p.Round_ID === roundId;
      });

      var cntWait = byRound.filter(function(p) { return p.Visit_Status !== 'เยี่ยมแล้ว'; }).length;
      var cntDone = byRound.filter(function(p) { return p.Visit_Status === 'เยี่ยมแล้ว'; }).length;
      document.getElementById('cnt-all').textContent = String(byRound.length);
      document.getElementById('cnt-wait').textContent = String(cntWait);
      document.getElementById('cnt-done').textContent = String(cntDone);

      var list = byRound.filter(function(p) {
        var matchSt = STATUS_FILTER === 'ALL' || (STATUS_FILTER === 'เยี่ยมแล้ว' ? p.Visit_Status === 'เยี่ยมแล้ว' : p.Visit_Status !== 'เยี่ยมแล้ว');
        var matchQ = !q || [p.Patient_Name, p.Address_Village, p.Subdistrict, p.Underlying_Disease, p.Patient_Group].some(function(s) {
          return String(s || '').toLowerCase().indexOf(q) !== -1;
        });
        return matchSt && matchQ;
      });

      if (!list.length) {
        wrap.innerHTML = '<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-400">ไม่พบรายชื่อผู้ป่วยในเงื่อนไขที่เลือก</div>';
        return;
      }

      wrap.innerHTML = list.map(function(p) {
        var isDone = p.Visit_Status === 'เยี่ยมแล้ว';
        var badge = isDone ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-amber-100 text-amber-800 border-amber-200';
        var navBtn = p.Map_Link
          ? '<a href="' + escapeHtml(p.Map_Link) + '" target="_blank" class="flex-1 text-center bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-3 rounded-xl text-xs transition">📍 เปิดแผนที่</a>'
          : '';
        var vitals = [];
        if (p.BP) vitals.push('BP: ' + p.BP);
        if (p.Weight_kg) vitals.push('นน.: ' + p.Weight_kg + ' กก.');
        if (p.Height_cm) vitals.push('สส.: ' + p.Height_cm + ' ซม.');
        var vitalsHtml = vitals.length ? '<div class="text-[11px] text-[#006837] bg-green-50 border border-green-100 rounded-lg px-2.5 py-1.5 mt-2 font-medium">🩺 ' + escapeHtml(vitals.join(' • ')) + '</div>' : '';
        var noteHtml = p.Visit_Note ? '<div class="text-xs text-slate-600 bg-slate-50 rounded-lg px-2.5 py-1.5 mt-1.5">📝 ' + escapeHtml(p.Visit_Note) + '</div>' : '';
        var photoList = [];
        if (p.Photo_URLs) {
          photoList = String(p.Photo_URLs).split(',').map(function(u) { return u.trim(); }).filter(Boolean);
        }
        if (p._localImages && p._localImages.length) {
          photoList = photoList.concat(p._localImages);
        }
        var photosHtml = '';
        if (photoList.length) {
          photosHtml = '<div class="mt-2">' +
            '<div class="text-[11px] font-medium text-slate-500 mb-1">📷 ภาพประกอบจากพื้นที่/เยี่ยมบ้าน (' + photoList.length + ' ภาพ — แตะเพื่อดูใหญ่)</div>' +
            '<div class="flex gap-1.5 overflow-x-auto pb-1">' +
            photoList.map(function(u) {
              var th = toDriveThumb(u);
              return '<img src="' + escapeHtml(th) + '" onclick="previewPhotoModal(\'' + escapeHtml(th) + '\', \'' + escapeHtml(u) + '\')" class="w-16 h-16 object-cover rounded-lg border border-green-200 shrink-0 cursor-pointer">';
            }).join('') +
            '</div></div>';
        }

        return '<div class="bg-white rounded-2xl shadow-sm border border-green-100 p-4">' +
          '<div class="flex items-start justify-between gap-2">' +
            '<div>' +
              '<div class="font-semibold text-base text-slate-800">' + escapeHtml(p.Patient_Name) + ' <span class="text-xs font-normal text-slate-500">(' + escapeHtml(p.Age) + ' ปี)</span></div>' +
              '<div class="text-xs text-slate-500 mt-0.5">🏠 ' + escapeHtml(p.Address_Village) + ' ต.' + escapeHtml(p.Subdistrict) + '</div>' +
            '</div>' +
            '<span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full border shrink-0 ' + badge + '">' + escapeHtml(p.Visit_Status || 'รอเยี่ยมบ้าน') + '</span>' +
          '</div>' +
          '<div class="mt-2.5 text-xs text-slate-700 space-y-1">' +
            '<div><b>กลุ่ม/โรค:</b> ' + escapeHtml(p.Patient_Group) + (p.Underlying_Disease ? (' — ' + escapeHtml(p.Underlying_Disease)) : '') + '</div>' +
            '<div><b>ผู้ดูแล:</b> ' + escapeHtml(p.Living_Caregiver || '-') + '</div>' +
            '<div><b>ความช่วยเหลือ:</b> ' + escapeHtml(p.Assistance_Needs || '-') + '</div>' +
          '</div>' +
          vitalsHtml +
          noteHtml +
          photosHtml +
          '<div class="mt-3 pt-2.5 border-t border-slate-100 flex flex-wrap gap-2">' +
            navBtn +
            '<button type="button" onclick="openEditPatientById(\'' + escapeHtml(p.Patient_ID) + '\')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-3 rounded-xl text-xs transition cursor-pointer">✏️ แก้ไขข้อมูล</button>' +
            '<button type="button" onclick="openVisitById(\'' + escapeHtml(p.Patient_ID) + '\')" class="flex-1 moph-btn font-medium py-2.5 px-3 rounded-xl text-xs transition cursor-pointer">📝 บันทึกผลเยี่ยม</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function compressImageFile(file, customMaxW, customQ) {
      return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          var img = new Image();
          img.onload = function() {
            var maxW = customMaxW || 900;
            var w = img.width;
            var h = img.height;
            if (w > maxW) {
              h = Math.round(h * (maxW / w));
              w = maxW;
            }
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', customQ || 0.65));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function getOfflineQueue() {
      try { return JSON.parse(localStorage.getItem(VISIT_QUEUE_KEY) || '[]'); } catch (e) { return []; }
    }

    function setOfflineQueue(arr) {
      localStorage.setItem(VISIT_QUEUE_KEY, JSON.stringify(arr || []));
      renderOfflineQueue();
    }

    function renderOfflineQueue() {
      var q = getOfflineQueue();
      var panel = document.getElementById('offline-sync-panel');
      var cnt = document.getElementById('offline-count');
      var list = document.getElementById('offline-list');
      if (!panel || !cnt || !list) return;
      if (!q.length) {
        panel.classList.add('hidden');
        cnt.textContent = '0';
        list.innerHTML = '';
        return;
      }
      panel.classList.remove('hidden');
      cnt.textContent = String(q.length);
      list.innerHTML = q.map(function(item, idx) {
        var imgCnt = (item.images && item.images.length) ? item.images.length : 0;
        return '<div class="bg-white rounded-xl border border-amber-200 px-3 py-2 flex items-center justify-between gap-2 text-xs">' +
          '<div class="min-w-0">' +

    function queueVisitOffline(p, val) {
      try {
        var q = getOfflineQueue();
        var exIdx = q.findIndex(function(x) { return x.patientId === p.Patient_ID; });
        var entry = {
          patientId: p.Patient_ID,
          patientName: p.Patient_Name,
          visitStatus: val.status,
          visitNote: val.note,
          visitExtra: val.visitExtra || {},
          images: val.images || [],
          savedAt: new Date().toLocaleString('th-TH')
        };
        if (exIdx !== -1) q[exIdx] = entry; else q.push(entry);
        setOfflineQueue(q);
        p.Visit_Status = val.status;
        p.Visit_Note = val.note;
        if (val.visitExtra) {
          if (val.visitExtra.cid) p.CID = val.visitExtra.cid;
          p.Birth_Date = val.visitExtra.birthDate || p.Birth_Date || '';
          p.BP = val.visitExtra.bp || p.BP || '';
          p.Weight_kg = val.visitExtra.weight || p.Weight_kg || '';
          p.Height_cm = val.visitExtra.height || p.Height_cm || '';
        }
        try { localStorage.setItem(CACHE_DATA_KEY, JSON.stringify(ADMIN_DATA)); } catch (e) {}
        renderPatients();
        Swal.fire({
          icon: 'success',
          title: 'บันทึกออฟไลน์แล้ว 💾',
          html: '<div class="text-sm">เก็บข้อมูลของ <b>' + escapeHtml(p.Patient_Name) + '</b> (' + entry.images.length + ' รูป) ไว้ในเครื่องแล้ว<br><span class="text-xs text-slate-500">เมื่อกลับมามีเน็ต กดปุ่ม <b>ซิงค์ขึ้นระบบ</b> ด้านบนได้เลยครับ</span></div>',
          confirmButtonColor: '#007a3d'
        });
      } catch (err) {
        Swal.fire('พื้นที่จัดเก็บเต็ม', 'ไม่สามารถบันทึกลงเครื่องได้ (ลองลดจำนวนรูปภาพที่แนบ)', 'error');
      }
    }

    function syncAllOffline() {
      if (!navigator.onLine) {
        Swal.fire('ยังไม่มีสัญญาณอินเทอร์เน็ต 🟠', 'กรุณารอให้เชื่อมต่ออินเทอร์เน็ตก่อนแล้วกดซิงค์อีกครั้งครับ', 'warning');
        return;
      }
      var q = getOfflineQueue();
      if (!q.length) return;
      var btn = document.getElementById('btn-sync-all');
      btn.disabled = true;
      btn.textContent = 'กำลังซิงค์...';
      var synced = 0;
      var failed = [];

      function nextItem() {
        var cur = getOfflineQueue();
        if (!cur.length) {
          btn.disabled = false;
          btn.textContent = '🔄 ซิงค์ขึ้นระบบ';
          if (failed.length) {
            setOfflineQueue(failed);
            Swal.fire('ซิงค์สำเร็จ ' + synced + ' รายการ', 'มีค้างส่ง ' + failed.length + ' รายการ กรุณาลองใหม่', 'warning');
          } else {
            Swal.fire('ซิงค์ครบแล้ว! 🎉', 'อัปเดตข้อมูลและอัปโหลดรูปทั้งหมด ' + synced + ' รายการเรียบร้อย', 'success');
          }
          refreshData();
          return;
        }
        var item = cur[0];
        var apiAction = item.type === 'edit' ? 'savePatientAdmin' : 'updatePatientVisit';
        var apiPayload = item.type === 'edit'
          ? { passcode: ADMIN_PASSCODE, obj: item.obj }
          : {
              passcode: ADMIN_PASSCODE,
              patientId: item.patientId,
              visitStatus: item.visitStatus,
              visitNote: item.visitNote,
              images: item.images || [],
              visitExtra: item.visitExtra || {}
            };
        callApi(apiAction, apiPayload, function(res) {
          var rem = getOfflineQueue();
          rem.shift();
          setOfflineQueue(rem);
          if (res && res.success) { synced++; } else { failed.push(item); }
          nextItem();
        }, function() {
          var rem = getOfflineQueue();
          rem.shift();
          setOfflineQueue(rem);
          failed.push(item);
          nextItem();
        });
      }
      nextItem();
    }

        renderPatients();
        Swal.fire({
          icon: 'success',

            '<div><label class="block text-slate-500 mb-0.5">ความดัน</label><input id="sw-v-bp" type="text" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="120/80" value="' + escapeHtml(p.BP || '') + '"></div>' +
            '<div><label class="block text-slate-500 mb-0.5">น้ำหนัก (กก.)</label><input id="sw-v-weight" type="text" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="55" value="' + escapeHtml(p.Weight_kg || '') + '"></div>' +
            '<div><label class="block text-slate-500 mb-0.5">ส่วนสูง (ซม.)</label><input id="sw-v-height" type="text" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="160" value="' + escapeHtml(p.Height_cm || '') + '"></div>' +
          '</div>' +
          '<div><label class="block text-slate-500 mb-0.5">สถานะ</label><select id="sw-v-status" class="swal2-select !m-0 !w-full !text-xs">' + stOptions + '</select></div>' +
          '<div><label class="block text-slate-500 mb-0.5">ข้อมูลเยี่ยม / อาการ / การช่วยเหลือ</label><textarea id="sw-v-note" rows="3" class="swal2-textarea !m-0 !w-full !text-xs !h-auto" placeholder="พิมพ์ผลการเยี่ยม...">' + escapeHtml(p.Visit_Note || '') + '</textarea></div>' +
          '<div><label class="block text-slate-500 mb-0.5">แนบภาพประกอบ (สูงสุด 10 ภาพ)</label>' +
          '<input id="sw-v-photos" type="file" accept="image/*" capture="environment" multiple class="w-full text-xs border border-slate-200 rounded-lg p-2 bg-slate-50">' +
          '<div id="sw-v-photo-count" class="text-[11px] text-[#007a3d] mt-1"></div></div>' +
          '</div>',
        showCancelButton: true,
        confirmButtonText: navigator.onLine ? 'บันทึกและอัปโหลด' : '💾 บันทึกออฟไลน์',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#007a3d',
        didOpen: function() {
          var inp = document.getElementById('sw-v-photos');
          var cnt = document.getElementById('sw-v-photo-count');
          if (inp && cnt) {
            inp.addEventListener('change', function() {
              var n = inp.files ? inp.files.length : 0;
              cnt.textContent = n > 10 ? 'เลือก ' + n + ' ภาพ (บันทึกเฉพาะ 10 ภาพแรก)' : (n > 0 ? 'เลือกแล้ว ' + n + ' / 10 ภาพ' : '');
            });
          }
        },
        preConfirm: function() {
          var files = document.getElementById('sw-v-photos').files;
          var selected = [];
          for (var i = 0; i < Math.min(files.length, 10); i++) {
            selected.push(compressImageFile(files[i], 900, 0.65));
          }
          return Promise.all(selected).then(function(b64List) {
            return {
              status: document.getElementById('sw-v-status').value,
              note: document.getElementById('sw-v-note').value,
              images: b64List,
              visitExtra: {
                birthDate: document.getElementById('sw-v-dob').value.trim(),
                cid: document.getElementById('sw-v-cid').value.trim(),
                bp: document.getElementById('sw-v-bp').value.trim(),
                weight: document.getElementById('sw-v-weight').value.trim(),
                height: document.getElementById('sw-v-height').value.trim()
              }
            };
          });
        }
      }).then(function(result) {
        if (result.isConfirmed && result.value) {
          if (!navigator.onLine) {
            queueVisitOffline(p, result.value);
            return;
          }
          Swal.fire({ title: 'กำลังบันทึกและอัปโหลดรูป...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
          callApi('updatePatientVisit', {
            passcode: ADMIN_PASSCODE,
            patientId: p.Patient_ID,
            visitStatus: result.value.status,
            visitNote: result.value.note,
            images: result.value.images,
            visitExtra: result.value.visitExtra
          }, function(res) {
            Swal.fire(res && res.success ? 'สำเร็จ' : 'ผิดพลาด', (res && res.message) || '', res && res.success ? 'success' : 'error');
            if (res && res.success) refreshData();
          }, function() {
            Swal.close();
            queueVisitOffline(p, result.value);
          });
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      updateNetBadge();
      window.addEventListener('online', function() {
        updateNetBadge();
        var q = getOfflineQueue();
        if (q.length) {
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'กลับมาออนไลน์แล้ว มี ' + q.length + ' เคสรอซิงค์', timer: 3500, showConfirmButton: false });
        }
      });
      window.addEventListener('offline', updateNetBadge);

      document.getElementById('form-login').addEventListener('submit', doLogin);
      document.getElementById('btn-add-patient').addEventListener('click', function() { openEditPatientById(null); });
      document.getElementById('btn-refresh').addEventListener('click', refreshData);
      document.getElementById('btn-logout').addEventListener('click', function() {
        ADMIN_PASSCODE = '';
        ADMIN_DATA = null;
        document.getElementById('sec-app').classList.add('hidden');
        document.getElementById('sec-login').classList.remove('hidden');
      });
      document.getElementById('filter-round').addEventListener('change', function() { populateRounds(); renderPatients(); });
      document.getElementById('filter-search').addEventListener('input', renderPatients);
      document.getElementById('btn-sync-all').addEventListener('click', syncAllOffline);

      var stBtns = document.querySelectorAll('.st-filter-btn');
      for (var i = 0; i < stBtns.length; i++) {
        (function(btn) {
          btn.addEventListener('click', function() {
            STATUS_FILTER = btn.getAttribute('data-st') || 'ALL';
            for (var j = 0; j < stBtns.length; j++) {
              stBtns[j].className = 'st-filter-btn rounded-xl border border-slate-200 bg-slate-50 text-slate-700 py-1.5 text-xs font-medium cursor-pointer';
            }
            btn.className = 'st-filter-btn rounded-xl border border-green-600 bg-[#007a3d] text-white py-1.5 text-xs font-medium cursor-pointer';
            renderPatients();
          });
        })(stBtns[i]);
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').catch(function() {});
        });
      }
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        DEFERRED_INSTALL_PROMPT = e;
        var b = document.getElementById('btn-pwa-install');
        if (b) b.classList.remove('hidden');
      });
      document.getElementById('btn-pwa-install').addEventListener('click', function() {
        if (!DEFERRED_INSTALL_PROMPT) return;
        DEFERRED_INSTALL_PROMPT.prompt();
        DEFERRED_INSTALL_PROMPT.userChoice.then(function() {
          DEFERRED_INSTALL_PROMPT = null;
          document.getElementById('btn-pwa-install').classList.add('hidden');
        });
      });
    });
  </script>
</body>
</html>
