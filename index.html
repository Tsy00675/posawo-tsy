<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>แอปเยี่ยมบ้าน พอ.สว. ท่าสองยาง</title>
  <meta name="theme-color" content="#007a3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="เยี่ยมบ้าน พอ.สว.">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f4f9f6; color: #1e293b; -webkit-tap-highlight-color: transparent; }
    .moph-header { background: linear-gradient(135deg, #007a3d 0%, #006837 100%); }
    .moph-btn { background-color: #007a3d; color: #ffffff; }
    .moph-btn:hover { background-color: #006837; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="moph-header text-white shadow-md sticky top-0 z-30">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-white/15 border border-white/25 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-house-medical text-lg text-white"></i>
        </div>
        <div class="min-w-0">
          <h1 class="text-sm sm:text-base font-semibold truncate">เยี่ยมบ้านผู้ป่วย พอ.สว.</h1>
          <p id="hdr-org" class="text-[11px] text-green-100 truncate">สสอ.ท่าสองยาง จ.ตาก</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" id="btn-pwa-install" class="hidden text-[11px] bg-white text-[#006837] font-semibold px-2.5 py-1 rounded-full shadow-xs cursor-pointer">📲 ติดตั้ง</button>
        <span id="net-badge" class="text-[11px] font-medium px-2.5 py-1 rounded-full bg-white/15 border border-white/25">🟢 ออนไลน์</span>
      </div>
    </div>
  </header>

  <main class="max-w-2xl w-full mx-auto px-3.5 py-4 flex-1 space-y-3.5">

    <!-- Login Screen (PDPA Protected) -->
    <section id="sec-login" class="bg-white rounded-2xl shadow-sm border border-green-100 p-6 text-center mt-4">
      <div class="w-14 h-14 rounded-2xl bg-green-100 text-[#007a3d] flex items-center justify-center mx-auto mb-3">
        <i class="fa-solid fa-user-shield text-2xl"></i>
      </div>
      <h2 class="text-lg font-semibold text-slate-800">เข้าสู่ระบบทีมเยี่ยมบ้าน</h2>
      <p class="text-xs text-slate-500 mt-1 mb-4">กรุณากรอกรหัสผ่านเพื่อเข้าดูรายชื่อผู้ป่วยและบันทึกผลเยี่ยมบ้าน (ใช้งานออฟไลน์ได้หลังเข้าสู่ระบบตอนมีเน็ต 1 ครั้ง)</p>
      <form id="form-login" class="space-y-3">
        <input type="password" id="login-pass" required autocomplete="off" placeholder="รหัสผ่านผู้ดูแลระบบ" class="w-full text-center rounded-xl border border-slate-300 px-4 py-3 text-base focus:ring-2 focus:ring-[#007a3d] outline-none">
        <button type="submit" id="btn-login" class="w-full moph-btn font-medium py-3 rounded-xl shadow-sm transition cursor-pointer text-sm">
          เข้าสู่ระบบเยี่ยมบ้าน
        </button>
      </form>
    </section>

    <!-- Main Patient Visit App -->
    <section id="sec-app" class="hidden space-y-3.5">

      <!-- Offline Sync Queue Banner -->
      <div id="offline-sync-panel" class="hidden rounded-2xl bg-amber-50 border border-amber-200 p-3.5">
        <div class="flex items-center justify-between gap-2 mb-2">
          <div class="text-xs font-semibold text-amber-900">
            📦 ผลเยี่ยมค้างส่ง (<span id="offline-count">0</span> รายการ)
          </div>
          <button type="button" id="btn-sync-all" class="bg-[#007a3d] hover:bg-[#006837] text-white text-xs font-medium px-3.5 py-1.5 rounded-xl shadow-xs cursor-pointer">
            🔄 ซิงค์ขึ้นระบบ
          </button>
        </div>
        <div id="offline-list" class="space-y-1.5"></div>
      </div>

      <!-- Filter & Summary Card -->
      <div class="bg-white rounded-2xl shadow-sm border border-green-100 p-3.5 space-y-2.5">
        <div class="flex items-center justify-between gap-2">
          <div class="text-xs font-semibold text-[#006837]" id="app-round-label">กำลังโหลดรอบ...</div>
          <div class="flex items-center gap-1.5 flex-wrap">
            <button type="button" id="btn-add-patient" class="text-xs bg-[#007a3d] hover:bg-[#006837] text-white font-medium px-2.5 py-1 rounded-lg cursor-pointer">➕ ลงคนไข้ใหม่</button>
            <button type="button" id="btn-refresh" class="text-xs bg-green-50 text-[#007a3d] border border-green-200 px-2.5 py-1 rounded-lg cursor-pointer">🔄 รีเฟรช</button>
            <button type="button" id="btn-logout" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg cursor-pointer">ออก</button>
          </div>
        </div>

        <select id="filter-round" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-[#007a3d]"></select>

        <div class="grid grid-cols-3 gap-2 text-center">
          <button type="button" data-st="ALL" class="st-filter-btn rounded-xl border border-green-600 bg-[#007a3d] text-white py-1.5 text-xs font-medium cursor-pointer">
            ทั้งหมด (<span id="cnt-all">0</span>)
          </button>
          <button type="button" data-st="รอเยี่ยมบ้าน" class="st-filter-btn rounded-xl border border-amber-200 bg-amber-50 text-amber-800 py-1.5 text-xs font-medium cursor-pointer">
            รอเยี่ยม (<span id="cnt-wait">0</span>)
          </button>
          <button type="button" data-st="เยี่ยมแล้ว" class="st-filter-btn rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-800 py-1.5 text-xs font-medium cursor-pointer">
            เยี่ยมแล้ว (<span id="cnt-done">0</span>)
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <input type="text" id="filter-search" placeholder="🔍 ค้นหาชื่อผู้ป่วย / หมู่บ้าน / ตำบล..." class="sm:col-span-2 rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-[#007a3d]">
          <select id="filter-level" class="rounded-xl border border-slate-300 px-3 py-2.5 text-xs bg-white outline-none focus:ring-2 focus:ring-[#007a3d]">
            <option value="ALL">ทุกระดับความเปราะบาง</option>
            <option value="ระดับ 1">🔴 ระดับ 1 (เร่งด่วน)</option>
            <option value="ระดับ 2">🟠 ระดับ 2 (ต่อเนื่อง)</option>
            <option value="ระดับ 3">🟡 ระดับ 3 (เฝ้าระวัง)</option>
          </select>
        </div>
        <div class="flex flex-wrap items-center gap-2 pt-0.5">
          <button type="button" id="btn-sort-nearest" class="flex-1 bg-sky-50 hover:bg-sky-100 text-sky-900 border border-sky-200 font-medium py-2 px-2.5 rounded-xl text-xs transition cursor-pointer">
            🧭 เรียงใกล้-ไกล
          </button>
          <button type="button" id="btn-sort-custom" class="flex-1 bg-slate-50 hover:bg-slate-100 text-slate-800 border border-slate-300 font-medium py-2 px-2.5 rounded-xl text-xs transition cursor-pointer">
            ↕️ จัดลำดับเอง
          </button>
          <a id="btn-multi-route" href="#" target="_blank" class="hidden w-full sm:w-auto text-center bg-[#007a3d] hover:bg-[#006837] text-white font-medium py-2 px-3 rounded-xl text-xs transition">
            🗺️ นำทางรวมหลายจุด
          </a>
        </div>
      </div>

      <!-- Patient Cards List -->
      <div id="patient-cards" class="space-y-3 pb-8"></div>

    </section>

  </main>

  <script>
    var DEFAULT_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxArwxigN7ImXL6BYGxVQ6jx8mKTZIX-b7g933ucqyjlowyYuW3c2YZi89FF4pTOvwB/exec';
    var CACHE_DATA_KEY = 'pmmv_field_admin_v1';
    var CACHE_PASS_KEY = 'pmmv_field_pass_v1';
    var VISIT_QUEUE_KEY = 'pmmv_visit_offline_queue_v1';
    var ADMIN_PASSCODE = '';
    var ADMIN_DATA = null;
    var STATUS_FILTER = 'ALL';
    var DEFERRED_INSTALL_PROMPT = null;

    function toDriveThumb(url) {
      var s = String(url || '').trim();
      if (s.indexOf('data:image') === 0) return s;
      var m = s.match(/\/d\/([a-zA-Z0-9_-]+)/) || s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return m ? ('https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w400') : s;
    }

    function deletePhotoAction(patientId, origUrl, localIdx) {
      var p = (ADMIN_DATA && ADMIN_DATA.patients || []).find(function(x) { return x.Patient_ID === patientId; });
      if (!p) return;
      if (localIdx !== -1 && p._localImages && p._localImages[localIdx] !== undefined) {
        p._localImages.splice(localIdx, 1);
        try { localStorage.setItem(CACHE_DATA_KEY, JSON.stringify(ADMIN_DATA)); } catch (e) {}
        renderPatients();
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'ลบรูปภาพแล้ว', timer: 1800, showConfirmButton: false });
        return;
      }
      var urls = String(p.Photo_URLs || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
      var remaining = urls.filter(function(u) { return u !== origUrl; });
      if (!navigator.onLine) {
        var q = getOfflineQueue();
        q.push({ type: 'delPhoto', patientId: p.Patient_ID, patientName: p.Patient_Name, photoUrl: origUrl, savedAt: new Date().toLocaleString('th-TH') });
        setOfflineQueue(q);
        p.Photo_URLs = remaining.join(', ');
        try { localStorage.setItem(CACHE_DATA_KEY, JSON.stringify(ADMIN_DATA)); } catch (e) {}
        renderPatients();
        Swal.fire('ลบรูปออฟไลน์แล้ว 💾', 'จะลบออกจากระบบจริงเมื่อซิงค์ตอนมีเน็ต', 'success');
        return;
      }
      Swal.fire({ title: 'กำลังลบรูปภาพ...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
      callApi('deletePatientPhoto', { passcode: ADMIN_PASSCODE, patientId: p.Patient_ID, photoUrl: origUrl }, function(res) {
        Swal.close();
        if (res && res.success) {
          p.Photo_URLs = res.photoUrls !== undefined ? res.photoUrls : remaining.join(', ');
          try { localStorage.setItem(CACHE_DATA_KEY, JSON.stringify(ADMIN_DATA)); } catch (e) {}
          renderPatients();
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'ลบรูปภาพเรียบร้อย', timer: 1800, showConfirmButton: false });
        } else {
          Swal.fire('ผิดพลาด', (res && res.message) || 'ลบรูปไม่สำเร็จ', 'error');
        }
      }, function(err) {
        Swal.close();
        Swal.fire('ผิดพลาด', formatErr(err), 'error');
      });
    }

    function previewPhotoModal(src, origUrl, patientId, localIdx) {
      Swal.fire({
        imageUrl: src,
        imageAlt: 'ภาพประกอบผู้ป่วย',
        showConfirmButton: true,
        confirmButtonText: 'ปิด',
        confirmButtonColor: '#007a3d',
        showDenyButton: true,
        denyButtonText: '🗑️ ลบรูปนี้',
        denyButtonColor: '#e11d48',
        footer: origUrl && origUrl.indexOf('http') === 0 ? ('<a href="' + escapeHtml(origUrl) + '" target="_blank" style="color:#007a3d;font-size:12px;">เปิดภาพขนาดเต็มใน Google Drive</a>') : ''
      }).then(function(r) {
        if (r.isDenied) {
          Swal.fire({
            title: 'ยืนยันลบรูปภาพนี้?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'ลบรูป',
            cancelButtonText: 'ยกเลิก',
            confirmButtonColor: '#e11d48'
          }).then(function(c) {
            if (c.isConfirmed) deletePhotoAction(patientId, origUrl, localIdx);
          });
        }
      });
    }

    var VULN_TYPES = [
      'ผู้สูงอายุเปราะบาง',
      'ผู้พิการ',
      'ผู้ป่วยโรคเรื้อรังที่มีภาวะพึ่งพิง',
      'ผู้ป่วยสุขภาพจิตและจิตเวช',
      'ผู้ป่วยระยะท้ายและประคับประคอง (Palliative Care)',
      'เด็กและเยาวชนกลุ่มเปราะบาง',
      'หญิงตั้งครรภ์และมารดากลุ่มเสี่ยง',
      'ครอบครัวยากจนและผู้ด้อยโอกาส',
      'ผู้ประสบปัญหาทางสังคม',
      'ประชากรชายขอบและผู้เข้าไม่ถึงบริการ'
    ];

    var VULN_LEVELS = [
      {
        val: 'ระดับ 1 : เปราะบางมาก (เร่งด่วน)',
        title: 'ระดับ 1 : เปราะบางมาก (เร่งด่วน)',
        desc: 'ผู้ป่วยติดเตียง ผู้ป่วยระยะท้าย ผู้พิการที่ช่วยเหลือตนเองไม่ได้ ผู้ป่วยจิตเวชที่มีความเสี่ยง และผู้ที่ไม่มีผู้ดูแล',
        cardCls: 'border-rose-400 bg-rose-50 text-rose-900',
        badgeCls: 'bg-rose-100 text-rose-800 border-rose-300',
        borderLeft: 'border-l-4 border-l-rose-500',
        icon: '🔴'
      },
      {
        val: 'ระดับ 2 : เปราะบาง (ติดตามต่อเนื่อง)',
        title: 'ระดับ 2 : เปราะบาง (ติดตามต่อเนื่อง)',
        desc: 'ผู้สูงอายุอยู่ลำพัง ผู้ป่วยโรคเรื้อรังที่มีข้อจำกัดในการดำเนินชีวิต ครอบครัวยากจน และเด็กกลุ่มเสี่ยง',
        cardCls: 'border-amber-400 bg-amber-50 text-amber-900',
        badgeCls: 'bg-amber-100 text-amber-800 border-amber-300',
        borderLeft: 'border-l-4 border-l-amber-500',
        icon: '🟠'
      },
      {
        val: 'ระดับ 3 : เฝ้าระวัง (ติดตามตามความเหมาะสม)',
        title: 'ระดับ 3 : เฝ้าระวัง (ติดตามตามความเหมาะสม)',
        desc: 'ประชาชนที่มีความเสี่ยงทางสังคม เข้าไม่ถึงบริการสุขภาพ หรือมีปัญหาด้านเศรษฐกิจและสภาพแวดล้อม',
        cardCls: 'border-yellow-400 bg-yellow-50 text-yellow-900',
        badgeCls: 'bg-yellow-100 text-yellow-800 border-yellow-300',
        borderLeft: 'border-l-4 border-l-yellow-500',
        icon: '🟡'
      }
    ];

    function getVulnLevelMeta(val) {
      var s = String(val || '');
      for (var i = 0; i < VULN_LEVELS.length; i++) {
        if (s.indexOf('ระดับ ' + (i + 1)) !== -1 || s === VULN_LEVELS[i].val) return VULN_LEVELS[i];
      }
      return null;
    }

    function buildVulnCheckboxesHtml(prefix, existingGroupStr) {
      var raw = String(existingGroupStr || '');
      var parts = raw.split(',').map(function(x) { return x.trim(); }).filter(Boolean);
      var otherText = '';
      parts.forEach(function(pt) {
        if (pt.indexOf('อื่นๆ:') === 0) {
          otherText = pt.replace(/^อื่นๆ:\s*/, '').trim();
        } else if (VULN_TYPES.indexOf(pt) === -1 && pt !== 'อื่นๆ') {
          otherText = otherText ? (otherText + ', ' + pt) : pt;
        }
      });
      var itemsHtml = VULN_TYPES.map(function(t, idx) {
        var chk = parts.indexOf(t) !== -1 ? ' checked' : '';
        return '<label class="flex items-start gap-2 p-1.5 rounded-lg hover:bg-green-50/70 cursor-pointer text-xs text-slate-700">' +
          '<input type="checkbox" class="' + prefix + '-grp-chk mt-0.5 accent-[#007a3d]" value="' + escapeHtml(t) + '"' + chk + '>' +
          '<span>' + escapeHtml(t) + '</span>' +
          '</label>';
      }).join('');
      var otherChk = otherText ? ' checked' : '';
      return '<div class="border border-slate-200 rounded-xl p-2 bg-slate-50/50 space-y-1 max-h-48 overflow-y-auto">' +
        itemsHtml +
        '<label class="flex items-start gap-2 p-1.5 rounded-lg hover:bg-green-50/70 cursor-pointer text-xs text-slate-700">' +
          '<input type="checkbox" id="' + prefix + '-grp-other-chk" class="mt-0.5 accent-[#007a3d]"' + otherChk + '>' +
          '<span>อื่นๆ (โปรดระบุ)</span>' +
        '</label>' +
        '<input id="' + prefix + '-grp-other-txt" type="text" class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-xs bg-white ' + (otherText ? '' : 'hidden') + '" placeholder="ระบุประเภทความเปราะบางอื่นๆ..." value="' + escapeHtml(otherText) + '">' +
      '</div>';
    }

    function buildVulnLevelCardsHtml(prefix, existingLevel) {
      var cur = String(existingLevel || VULN_LEVELS[0].val);
      return '<div class="space-y-1.5">' + VULN_LEVELS.map(function(lv, idx) {
        var checked = (cur.indexOf('ระดับ ' + (idx + 1)) !== -1 || (idx === 0 && !getVulnLevelMeta(cur))) ? ' checked' : '';
        return '<label class="block rounded-xl border-2 p-2.5 cursor-pointer transition ' + lv.cardCls + '">' +
          '<div class="flex items-start gap-2">' +
            '<input type="radio" name="' + prefix + '-vlevel" value="' + escapeHtml(lv.val) + '" class="mt-1 accent-[#007a3d]"' + checked + '>' +
            '<div>' +
              '<div class="font-semibold text-xs">' + lv.icon + ' ' + escapeHtml(lv.title) + '</div>' +
              '<div class="text-[11px] opacity-85 mt-0.5 leading-snug">' + escapeHtml(lv.desc) + '</div>' +
            '</div>' +
          '</div>' +
        '</label>';
      }).join('') + '</div>';
    }

    function bindVulnOtherToggle(prefix) {
      var chk = document.getElementById(prefix + '-grp-other-chk');
      var txt = document.getElementById(prefix + '-grp-other-txt');
      if (chk && txt) {
        chk.addEventListener('change', function() {
          if (chk.checked) { txt.classList.remove('hidden'); txt.focus(); }
          else { txt.classList.add('hidden'); }
        });
      }
    }

    function readVulnSelections(prefix) {
      var chks = document.querySelectorAll('.' + prefix + '-grp-chk:checked');
      var selected = [];
      for (var i = 0; i < chks.length; i++) selected.push(chks[i].value);
      var oChk = document.getElementById(prefix + '-grp-other-chk');
      var oTxt = document.getElementById(prefix + '-grp-other-txt');
      if (oChk && oChk.checked) {
        var ov = oTxt ? oTxt.value.trim() : '';
        selected.push(ov ? ('อื่นๆ: ' + ov) : 'อื่นๆ');
      }
      var rad = document.querySelector('input[name="' + prefix + '-vlevel"]:checked');
      return {
        patientGroup: selected.join(', '),
        vulnerabilityLevel: rad ? rad.value : VULN_LEVELS[0].val
      };
    }

    var CUSTOM_SORT_MODE = false;
    var CUSTOM_ORDER_KEY = 'pmmv_custom_order_v1';

    function getCustomOrder() {
      try { return JSON.parse(localStorage.getItem(CUSTOM_ORDER_KEY) || '[]'); } catch (e) { return []; }
    }

    function setCustomOrder(arr) {
      localStorage.setItem(CUSTOM_ORDER_KEY, JSON.stringify(arr || []));
    }

    function toggleCustomSort() {
      var btn = document.getElementById('btn-sort-custom');
      CUSTOM_SORT_MODE = !CUSTOM_SORT_MODE;
      if (CUSTOM_SORT_MODE) {
        if (SORT_NEAREST && TEAM_COORDS) {
          // Seed custom order from current GPS-sorted list so user can tweak it!
          var curIds = getCurrentRenderedListIds();
          if (curIds.length) setCustomOrder(curIds);
          SORT_NEAREST = false;
          var nBtn = document.getElementById('btn-sort-nearest');
          if (nBtn) {
            nBtn.className = 'flex-1 bg-sky-50 hover:bg-sky-100 text-sky-900 border border-sky-200 font-medium py-2 px-2.5 rounded-xl text-xs transition cursor-pointer';
            nBtn.textContent = '🧭 เรียงใกล้-ไกล';
          }
        } else {
          var ord = getCustomOrder();
          var allIds = (ADMIN_DATA && ADMIN_DATA.patients || []).map(function(p) { return p.Patient_ID; });
          if (!ord.length) setCustomOrder(allIds);
        }
        if (btn) {
          btn.className = 'flex-1 bg-slate-800 text-white border border-slate-900 font-medium py-2 px-2.5 rounded-xl text-xs transition cursor-pointer';
          btn.textContent = '✅ กำลังจัดลำดับ (แตะเพื่อปิด)';
        }
      } else {
        if (btn) {
          btn.className = 'flex-1 bg-slate-50 hover:bg-slate-100 text-slate-800 border border-slate-300 font-medium py-2 px-2.5 rounded-xl text-xs transition cursor-pointer';
          btn.textContent = '↕️ จัดลำดับเอง';
        }
      }
      renderPatients();
    }

    function getCurrentRenderedListIds() {
      if (!ADMIN_DATA || !ADMIN_DATA.patients) return [];
      var list = ADMIN_DATA.patients.slice();
      if (SORT_NEAREST && TEAM_COORDS) {
        list.sort(function(a, b) {
          var ca = parseCoords(a.GPS_Coords, a.Map_Link);
          var cb = parseCoords(b.GPS_Coords, b.Map_Link);
          var da = ca ? calcDistanceKm(TEAM_COORDS.lat, TEAM_COORDS.lng, ca[0], ca[1]) : 999999;
          var db = cb ? calcDistanceKm(TEAM_COORDS.lat, TEAM_COORDS.lng, cb[0], cb[1]) : 999999;
          return da - db;
        });
      }
      return list.map(function(p) { return p.Patient_ID; });
    }

    function movePatientOrder(patientId, dir) {
      var ord = getCustomOrder();
      var allIds = (ADMIN_DATA && ADMIN_DATA.patients || []).map(function(p) { return p.Patient_ID; });
      allIds.forEach(function(id) { if (ord.indexOf(id) === -1) ord.push(id); });
      var idx = ord.indexOf(patientId);
      if (idx === -1) return;
      var newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= ord.length) return;
      var tmp = ord[idx];
      ord[idx] = ord[newIdx];
      ord[newIdx] = tmp;
      setCustomOrder(ord);
      renderPatients();
    }

    var SORT_NEAREST = false;
    var TEAM_COORDS = null;

    function parseCoords(gpsStr, mapUrl) {
      var s = String(gpsStr || '').trim();
      var m = s.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      if (m) return [parseFloat(m[1]), parseFloat(m[2])];
      var u = String(mapUrl || '').trim();
      var m2 = u.match(/[?&]q=(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      if (m2) return [parseFloat(m2[1]), parseFloat(m2[2])];
      return null;
    }

    function calcDistanceKm(lat1, lon1, lat2, lon2) {
      var R = 6371;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLon = (lon2 - lon1) * Math.PI / 180;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDistText(km) {
      if (km === null || km === undefined || !isFinite(km)) return '';
      if (km < 1) return Math.round(km * 1000) + ' ม.';
      return km.toFixed(1) + ' กม.';
    }

    function toggleSortNearest() {
      var btn = document.getElementById('btn-sort-nearest');
      var routeBtn = document.getElementById('btn-multi-route');
      if (SORT_NEAREST) {
        SORT_NEAREST = false;
        TEAM_COORDS = null;
        if (btn) {
          btn.className = 'flex-1 bg-sky-50 hover:bg-sky-100 text-sky-900 border border-sky-200 font-medium py-2 px-3 rounded-xl text-xs transition cursor-pointer';
          btn.textContent = '🧭 เรียงจากใกล้ไปไกล (GPS ทีม)';
        }
        if (routeBtn) routeBtn.classList.add('hidden');
        renderPatients();
        return;
      }
      if (!navigator.geolocation) {
        Swal.fire('ไม่รองรับ GPS', 'อุปกรณ์นี้ไม่รองรับการดึงพิกัด GPS', 'warning');
        return;
      }
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ กำลังจับพิกัด GPS ของทีม...';
      }
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          TEAM_COORDS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          SORT_NEAREST = true;
          if (btn) {
            btn.disabled = false;
            btn.className = 'flex-1 bg-sky-600 text-white border border-sky-700 font-medium py-2 px-3 rounded-xl text-xs transition cursor-pointer';
            btn.textContent = '🧭 เรียงใกล้-ไกลแล้ว (แตะเพื่อยกเลิก)';
          }
          renderPatients();
        },
        function() {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '🧭 เรียงจากใกล้ไปไกล (GPS ทีม)';
          }
          Swal.fire('ดึงพิกัดไม่ได้', 'กรุณาเปิดสิทธิ์ Location / GPS บนโทรศัพท์แล้วลองใหม่อีกครั้ง', 'warning');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function encodePass(p) {
      try { return btoa(unescape(encodeURIComponent(String(p || '')))); } catch (e) { return String(p || ''); }
    }

    function formatErr(err) {
      if (!err) return 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
      if (typeof err === 'string') return err;
      return err.message || String(err);
    }

    function callApi(action, payload, onOk, onFail) {
      fetch(DEFAULT_GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: payload || {} })
      })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) { if (onOk) onOk(data); })
      .catch(function(err) { if (onFail) onFail(err); });
    }

    function updateNetBadge() {
      var b = document.getElementById('net-badge');
      if (!b) return;
      if (navigator.onLine) {
        b.className = 'text-[11px] font-medium px-2.5 py-1 rounded-full bg-white/15 border border-white/25';
        b.textContent = '🟢 ออนไลน์';
      } else {
        b.className = 'text-[11px] font-medium px-2.5 py-1 rounded-full bg-amber-400 text-amber-950 font-semibold';
        b.textContent = '🟠 ออฟไลน์';
      }
    }

    function unlockWithCache(pass) {
      try {
        var sp = localStorage.getItem(CACHE_PASS_KEY);
        var sd = localStorage.getItem(CACHE_DATA_KEY);
        if (!sp || !sd) return false;
        if (encodePass(pass) !== sp) return false;
        ADMIN_PASSCODE = pass;
        ADMIN_DATA = JSON.parse(sd);
        showApp();
        return true;
      } catch (e) {
        return false;
      }
    }

    function showApp() {
      document.getElementById('sec-login').classList.add('hidden');
      document.getElementById('sec-app').classList.remove('hidden');
      if (ADMIN_DATA && ADMIN_DATA.settings && ADMIN_DATA.settings.orgName) {
        document.getElementById('hdr-org').textContent = ADMIN_DATA.settings.orgName;
      }
      populateRounds();
      renderOfflineQueue();
      renderPatients();
    }

    function doLogin(e) {
      e.preventDefault();
      var pass = document.getElementById('login-pass').value;
      if (!navigator.onLine) {
        if (!unlockWithCache(pass)) {
          Swal.fire('เข้าออฟไลน์ไม่ได้', 'กรุณาล็อกอินตอนมีอินเทอร์เน็ตอย่างน้อย 1 ครั้งก่อนลงพื้นที่ (หรือตรวจสอบรหัสผ่าน)', 'warning');
        }
        return;
      }
      Swal.fire({ title: 'กำลังเข้าสู่ระบบ...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
      callApi('verifyAdmin', { passcode: pass }, function(res) {
        Swal.close();
        if (res && res.success) {
          ADMIN_PASSCODE = pass;
          ADMIN_DATA = res;
          try {
            localStorage.setItem(CACHE_PASS_KEY, encodePass(pass));
            localStorage.setItem(CACHE_DATA_KEY, JSON.stringify(res));
          } catch (err) {}
          showApp();
        } else {
          Swal.fire('รหัสผ่านไม่ถูกต้อง', (res && res.message) || 'กรุณาตรวจสอบรหัสผ่าน', 'error');
        }
      }, function(err) {
        Swal.close();
        if (!unlockWithCache(pass)) {
          Swal.fire('เกิดข้อผิดพลาด', formatErr(err), 'error');
        }
      });
    }

    function refreshData() {
      if (!navigator.onLine) {
        Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: '🟠 ขณะนี้ออฟไลน์ ใช้ข้อมูลในเครื่อง', timer: 2000, showConfirmButton: false });
        return;
      }
      Swal.fire({ title: 'กำลังอัปเดตข้อมูล...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
      callApi('verifyAdmin', { passcode: ADMIN_PASSCODE }, function(res) {
        Swal.close();
        if (res && res.success) {
          ADMIN_DATA = res;
          try { localStorage.setItem(CACHE_DATA_KEY, JSON.stringify(res)); } catch (err) {}
          populateRounds();
          renderPatients();
        }
      }, function(err) {
        Swal.close();
        Swal.fire('อัปเดตไม่สำเร็จ', formatErr(err), 'warning');
      });

    function populateRounds() {
      var sel = document.getElementById('filter-round');
      if (!sel || !ADMIN_DATA) return;
      var rounds = ADMIN_DATA.rounds || [];
      var cur = sel.value;
      var opts = '<option value="ALL">ทุกรอบออกหน่วย</option>' + rounds.map(function(r) {
        return '<option value="' + escapeHtml(r.Round_ID) + '">รอบ ' + escapeHtml(r.Round_No) + ' (' + escapeHtml(r.Month_Label) + ') ' + escapeHtml(r.Location) + '</option>';
      }).join('');
      sel.innerHTML = opts;
      var openR = rounds.find(function(r) { return r.Status === 'เปิดรับลงทะเบียน'; });
      if (cur && rounds.some(function(r) { return r.Round_ID === cur; })) {
        sel.value = cur;
      } else if (openR) {
        sel.value = openR.Round_ID;
      }
      var lbl = document.getElementById('app-round-label');
      var activeR = rounds.find(function(r) { return r.Round_ID === sel.value; });
      if (lbl) lbl.textContent = activeR ? ('📍 ' + activeR.Location + ' ต.' + activeR.Subdistrict) : 'รายชื่อผู้ป่วยทั้งหมด';
    }

    function renderPatients() {
      var wrap = document.getElementById('patient-cards');
      var sel = document.getElementById('filter-round');
      var q = String(document.getElementById('filter-search').value || '').toLowerCase().trim();
      if (!wrap || !ADMIN_DATA) return;

      var roundId = sel ? sel.value : 'ALL';
      var byRound = (ADMIN_DATA.patients || []).filter(function(p) {
        return roundId === 'ALL' || p.Round_ID === roundId;
      });

      var cntWait = byRound.filter(function(p) { return p.Visit_Status !== 'เยี่ยมแล้ว'; }).length;
      var cntDone = byRound.filter(function(p) { return p.Visit_Status === 'เยี่ยมแล้ว'; }).length;
      document.getElementById('cnt-all').textContent = String(byRound.length);
      document.getElementById('cnt-wait').textContent = String(cntWait);
      document.getElementById('cnt-done').textContent = String(cntDone);

      var lvFilter = document.getElementById('filter-level') ? document.getElementById('filter-level').value : 'ALL';
      var list = byRound.filter(function(p) {
        var matchSt = STATUS_FILTER === 'ALL' || (STATUS_FILTER === 'เยี่ยมแล้ว' ? p.Visit_Status === 'เยี่ยมแล้ว' : p.Visit_Status !== 'เยี่ยมแล้ว');
        var matchLv = lvFilter === 'ALL' || String(p.Vulnerability_Level || '').indexOf(lvFilter) !== -1;
        var matchQ = !q || [p.Patient_Name, p.Address_Village, p.Subdistrict, p.Underlying_Disease, p.Patient_Group].some(function(s) {
          return String(s || '').toLowerCase().indexOf(q) !== -1;
        });
        return matchSt && matchLv && matchQ;
      });

      var routeBtn = document.getElementById('btn-multi-route');
      var customOrd = getCustomOrder();
      if (SORT_NEAREST && TEAM_COORDS) {
        list = list.slice().sort(function(a, b) {
          var ca = parseCoords(a.GPS_Coords, a.Map_Link);
          var cb = parseCoords(b.GPS_Coords, b.Map_Link);
          var da = ca ? calcDistanceKm(TEAM_COORDS.lat, TEAM_COORDS.lng, ca[0], ca[1]) : 999999;
          var db = cb ? calcDistanceKm(TEAM_COORDS.lat, TEAM_COORDS.lng, cb[0], cb[1]) : 999999;
          return da - db;
        });
      } else if (CUSTOM_SORT_MODE || customOrd.length > 0) {
        list = list.slice().sort(function(a, b) {
          var ia = customOrd.indexOf(a.Patient_ID);
          var ib = customOrd.indexOf(b.Patient_ID);
          if (ia === -1) ia = 999999;
          if (ib === -1) ib = 999999;
          return ia - ib;
        });
      }

      if (routeBtn && (SORT_NEAREST || CUSTOM_SORT_MODE || customOrd.length > 0)) {
        var unvisitedPts = [];

          var gUrl = 'https://www.google.com/maps/dir/?api=1' + origParam + '&destination=' + encodeURIComponent(dest) + (wps.length ? ('&waypoints=' + encodeURIComponent(wps.join('|'))) : '');
          routeBtn.href = gUrl;
          routeBtn.classList.remove('hidden');

          : '';

            '<div class="flex items-center justify-between gap-2">' +
              '<div class="text-[11px] font-semibold text-sky-900">💬 โน้ตทีมสหวิชาชีพก่อนลงเยี่ยม</div>' +

        return '<div class="bg-white rounded-2xl shadow-sm border ' + cardBorder + ' p-4">' +

    function compressImageFile(file, customMaxW, customQ) {
      return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          var img = new Image();
          img.onload = function() {
            var maxW = customMaxW || 900;
            var w = img.width;
            var h = img.height;
            if (w > maxW) {
              h = Math.round(h * (maxW / w));
              w = maxW;
            }
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', customQ || 0.65));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function syncAllOffline() {
      if (!navigator.onLine) {
        Swal.fire('ยังไม่มีสัญญาณอินเทอร์เน็ต 🟠', 'กรุณารอให้เชื่อมต่ออินเทอร์เน็ตก่อนแล้วกดซิงค์อีกครั้งครับ', 'warning');
        return;
      }
      var q = getOfflineQueue();
      if (!q.length) return;
      var btn = document.getElementById('btn-sync-all');
      btn.disabled = true;
      btn.textContent = 'กำลังซิงค์...';
      var synced = 0;
      var failed = [];

      function nextItem() {
        var cur = getOfflineQueue();
        if (!cur.length) {
          btn.disabled = false;
          btn.textContent = '🔄 ซิงค์ขึ้นระบบ';
          if (failed.length) {
            setOfflineQueue(failed);
            Swal.fire('ซิงค์สำเร็จ ' + synced + ' รายการ', 'มีค้างส่ง ' + failed.length + ' รายการ กรุณาลองใหม่', 'warning');
          } else {
            Swal.fire('ซิงค์ครบแล้ว! 🎉', 'อัปเดตข้อมูลและอัปโหลดรูปทั้งหมด ' + synced + ' รายการเรียบร้อย', 'success');
          }
          refreshData();
          return;
        }
        var item = cur[0];
        var apiAction = item.type === 'edit' ? 'savePatientAdmin'
          : (item.type === 'note' ? 'addTeamNote'
          : (item.type === 'setNotes' ? 'updateTeamNotes'
          : (item.type === 'delPhoto' ? 'deletePatientPhoto' : 'updatePatientVisit')));
        var apiPayload = item.type === 'edit'
          ? { passcode: ADMIN_PASSCODE, obj: item.obj }
          : (item.type === 'note'
              ? { passcode: ADMIN_PASSCODE, patientId: item.patientId, discipline: item.discipline, author: item.author, note: item.note }
              : (item.type === 'setNotes'
                  ? { passcode: ADMIN_PASSCODE, patientId: item.patientId, teamNotes: item.teamNotes }
                  : (item.type === 'delPhoto'
                      ? { passcode: ADMIN_PASSCODE, patientId: item.patientId, photoUrl: item.photoUrl }
                      : {
                          passcode: ADMIN_PASSCODE,
                          patientId: item.patientId,
                          visitStatus: item.visitStatus,
                          visitNote: item.visitNote,
                          images: item.images || [],
                          visitExtra: item.visitExtra || {}
                        })));
        callApi(apiAction, apiPayload, function(res) {
          var rem = getOfflineQueue();
          rem.shift();
          setOfflineQueue(rem);
          if (res && res.success) { synced++; } else { failed.push(item); }
          nextItem();
        }, function() {
          var rem = getOfflineQueue();
          rem.shift();
          setOfflineQueue(rem);
          failed.push(item);
          nextItem();
        });
      }
      nextItem();
    }

        title: p ? 'แก้ไข / ข้อมูลลงทะเบียนผู้ป่วย' : '➕ ลงทะเบียนผู้ป่วยเยี่ยมบ้านใหม่',
        width: '95%',
        html:
          '<div class="space-y-2 text-left text-xs">' +
          '<label class="block text-slate-500">รอบออกหน่วย *</label><select id="sw-ep-round" class="swal2-select !m-0 !w-full !text-xs">' + roundOpts + '</select>' +
          '<label class="block text-slate-500">ชื่อ-นามสกุลผู้ป่วย *</label><input id="sw-ep-name" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="ระบุชื่อ-นามสกุลผู้ป่วย" value="' + escapeHtml(p ? p.Patient_Name : '') + '">' +
          '<div class="grid grid-cols-2 gap-2">' +
            '<div><label class="block text-slate-500">อายุ (ปี) *</label><input id="sw-ep-age" type="number" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="เช่น 75" value="' + escapeHtml(p ? p.Age : '') + '"></div>' +
            '<div><label class="block text-slate-500">เบอร์โทรผู้ป่วย/ญาติ</label><input id="sw-ep-phone" type="tel" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="08X-XXX-XXXX" value="' + escapeHtml(p ? (p.Phone || '') : '') + '"></div>' +
          '</div>' +
          '<label class="block text-slate-500">เลขประจำตัวประชาชน 13 หลัก (ถ้ามี)</label><input id="sw-ep-cid" maxlength="13" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="กรอกเฉพาะตัวเลข 13 หลัก" value="' + escapeHtml(p ? (p.CID || '') : '') + '">' +
          '<div class="grid grid-cols-2 gap-2">' +
            '<div><label class="block text-slate-500">ตำบล *</label><select id="sw-ep-sub" class="swal2-select !m-0 !w-full !text-xs">' + subOpts + '</select></div>' +
            '<div><label class="block text-slate-500">ที่อยู่ / หมู่บ้าน *</label><input id="sw-ep-addr" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="บ้านเลขที่ หมู่ที่ หมู่บ้าน" value="' + escapeHtml(p ? p.Address_Village : '') + '"></div>' +
          '</div>' +
          '<div class="flex items-center justify-between"><label class="block text-slate-500">พิกัดบ้านผู้ป่วย (GPS)</label><button type="button" id="sw-ep-gps-btn" class="text-[11px] bg-green-100 text-[#006837] px-2.5 py-1 rounded-lg font-medium cursor-pointer">📍 ดึงพิกัดปัจจุบัน</button></div>' +
          '<input id="sw-ep-gps" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="ละติจูด, ลองจิจูด (สร้างลิงก์แผนที่อัตโนมัติ)" value="' + escapeHtml(p ? (p.GPS_Coords || '') : '') + '">' +
          '<label class="block text-slate-500 font-medium">กลุ่มเป้าหมาย / ประเภทความเปราะบาง (เลือกได้มากกว่า 1 ข้อ) *</label>' + grpCheckHtml +
          '<label class="block text-slate-500 font-medium mt-1">ระดับความเปราะบาง *</label>' + lvlCardsHtml +
          '<label class="block text-slate-500">ป่วยเป็นโรค / การวินิจฉัย *</label><input id="sw-ep-dis" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="เช่น เบาหวาน, ความดัน, อัมพฤกษ์" value="' + escapeHtml(p ? p.Underlying_Disease : '') + '">' +
          '<label class="block text-slate-500">ประวัติการมา รพ.ท่าสองยาง</label><input id="sw-ep-hosp" class="swal2-input !m-0 !w-full !text-xs !h-9" value="' + escapeHtml(curHosp) + '">' +
          '<label class="block text-slate-500">สภาพความเป็นอยู่ / ผู้ดูแล *</label><input id="sw-ep-care" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="เช่น อาศัยอยู่กับบุตร" value="' + escapeHtml(p ? (p.Living_Caregiver || '') : '') + '">' +
          '<label class="block text-slate-500">ความต้องการช่วยเหลือ *</label><textarea id="sw-ep-need" rows="2" class="swal2-textarea !m-0 !w-full !text-xs !h-auto" placeholder="1. สนับสนุนถุงยังชีพ&#10;2. เยี่ยมบ้าน...">' + escapeHtml(p ? (p.Assistance_Needs || '') : '') + '</textarea>' +
          '<div class="grid grid-cols-2 gap-2">' +
            '<div><label class="block text-slate-500">ชื่อผู้แจ้ง</label><input id="sw-ep-rep" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="ชื่อ อสม./จนท." value="' + escapeHtml(p ? (p.Reporter_Name || '') : '') + '"></div>' +
            '<div><label class="block text-slate-500">หน่วยบริการ/รพ.สต.</label><input id="sw-ep-ag" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="รพ.สต./สสช." value="' + escapeHtml(p ? (p.Reporter_Agency || '') : '') + '"></div>' +
          '</div>' +
          '<div><label class="block text-slate-500 mb-0.5">แนบภาพสภาพบ้าน/ผู้ป่วยก่อนลงเยี่ยม (ไม่เกิน 10 ภาพ)</label>' +
          '<input id="sw-ep-photos" type="file" accept="image/*" capture="environment" multiple class="w-full text-xs border border-slate-200 rounded-lg p-2 bg-slate-50"></div>' +
          '</div>',
        showCancelButton: true,
        confirmButtonText: navigator.onLine ? (p ? 'บันทึกการแก้ไข' : 'ลงทะเบียนคนไข้ใหม่') : '💾 บันทึกออฟไลน์',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#007a3d',
        didOpen: function() {
          bindVulnOtherToggle('sw-ep');
          var gBtn = document.getElementById('sw-ep-gps-btn');
          if (gBtn) {
            gBtn.addEventListener('click', function() {
              if (!navigator.geolocation) return;
              gBtn.textContent = 'กำลังดึงพิกัด...';
              navigator.geolocation.getCurrentPosition(function(pos) {
                gBtn.textContent = '📍 ดึงพิกัดปัจจุบัน';
                document.getElementById('sw-ep-gps').value = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6);
              }, function() {
                gBtn.textContent = '📍 ดึงพิกัดปัจจุบัน';
              }, { enableHighAccuracy: true, timeout: 10000 });
            });
          }
        },
        preConfirm: function() {
          var name = document.getElementById('sw-ep-name').value.trim();
          if (!name) {
            Swal.showValidationMessage('กรุณากรอกชื่อ-นามสกุลผู้ป่วย');
            return false;
          }
          var vulnSel = readVulnSelections('sw-ep');
          if (!vulnSel.patientGroup) {
            Swal.showValidationMessage('กรุณาเลือกกลุ่มเป้าหมาย / ประเภทความเปราะบางอย่างน้อย 1 ข้อ');
            return false;
          }
          var files = document.getElementById('sw-ep-photos').files;
          var selected = [];
          for (var i = 0; i < Math.min(files.length, 10); i++) {
            selected.push(compressImageFile(files[i], 900, 0.65));
          }
          return Promise.all(selected).then(function(b64List) {
            var gps = document.getElementById('sw-ep-gps').value.trim();
            var mapLink = gps ? ('https://maps.google.com/?q=' + gps.replace(/\s+/g, '')) : (p ? (p.Map_Link || '') : '');
            return {
              patientId: p ? p.Patient_ID : '',
              roundId: document.getElementById('sw-ep-round').value,
              patientName: name,
              age: document.getElementById('sw-ep-age').value,
              cid: document.getElementById('sw-ep-cid').value.trim(),
              phone: document.getElementById('sw-ep-phone').value.trim(),
              subdistrict: document.getElementById('sw-ep-sub').value,
              addressVillage: document.getElementById('sw-ep-addr').value.trim(),
              gpsCoords: gps,
              mapLink: mapLink,
              patientGroup: vulnSel.patientGroup,
              vulnerabilityLevel: vulnSel.vulnerabilityLevel,
              underlyingDisease: document.getElementById('sw-ep-dis').value.trim(),
              hospitalHistory: document.getElementById('sw-ep-hosp').value.trim(),
              livingCaregiver: document.getElementById('sw-ep-care').value.trim(),
              assistanceNeeds: document.getElementById('sw-ep-need').value.trim(),
              reporterName: document.getElementById('sw-ep-rep').value.trim(),
              reporterAgency: document.getElementById('sw-ep-ag').value.trim(),
              visitStatus: p ? (p.Visit_Status || 'รอเยี่ยมบ้าน') : 'รอเยี่ยมบ้าน',
              visitNote: p ? (p.Visit_Note || '') : '',
              images: b64List
            };
          });
        }
      }).then(function(result) {
        if (result.isConfirmed && result.value) {
          if (!navigator.onLine) {
            queuePatientFormOffline(p, result.value);
            return;
          }
          Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
          callApi('savePatientAdmin', { passcode: ADMIN_PASSCODE, obj: result.value }, function(res) {
            Swal.fire(res && res.success ? 'สำเร็จ' : 'ผิดพลาด', (res && res.message) || '', res && res.success ? 'success' : 'error');
            if (res && res.success) refreshData();
          }, function() {
            Swal.close();
            queuePatientFormOffline(p, result.value);
          });
        }
      });
    }

    function openVisitById(patientId) {
      var p = (ADMIN_DATA && ADMIN_DATA.patients || []).find(function(x) { return x.Patient_ID === patientId; });
      if (!p) return;
      var stOptions = ['รอเยี่ยมบ้าน', 'เยี่ยมแล้ว', 'เลื่อน / ไม่พบผู้ป่วย'].map(function(st) {
        return '<option value="' + st + '"' + (p.Visit_Status === st ? ' selected' : '') + '>' + st + '</option>';
      }).join('');

      Swal.fire({
        title: 'บันทึกผลเยี่ยม: ' + p.Patient_Name,
        width: '95%',
        html:
          '<div class="space-y-2.5 text-left text-xs">' +
          '<div class="bg-green-50 border border-green-200 rounded-lg p-2 text-slate-700"><b>ที่อยู่:</b> ' + escapeHtml(p.Address_Village) + ' ต.' + escapeHtml(p.Subdistrict) + '</div>' +
          '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">' +
            '<div><label class="block text-slate-500 mb-0.5">วัน/เดือน/ปีเกิด</label><input id="sw-v-dob" type="text" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="เช่น 17/12/2500" value="' + escapeHtml(p.Birth_Date || '') + '"></div>' +
            '<div><label class="block text-slate-500 mb-0.5">เลขบัตรประชาชน 13 หลัก</label><input id="sw-v-cid" type="text" maxlength="13" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="1-xxxx-xxxxx-xx-x" value="' + escapeHtml(p.CID || '') + '"></div>' +
          '</div>' +
          '<div class="grid grid-cols-3 gap-2">' +
            '<div><label class="block text-slate-500 mb-0.5">ความดัน</label><input id="sw-v-bp" type="text" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="120/80" value="' + escapeHtml(p.BP || '') + '"></div>' +
            '<div><label class="block text-slate-500 mb-0.5">น้ำหนัก (กก.)</label><input id="sw-v-weight" type="text" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="55" value="' + escapeHtml(p.Weight_kg || '') + '"></div>' +
            '<div><label class="block text-slate-500 mb-0.5">ส่วนสูง (ซม.)</label><input id="sw-v-height" type="text" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="160" value="' + escapeHtml(p.Height_cm || '') + '"></div>' +
          '</div>' +
          '<div><label class="block text-slate-500 mb-0.5">สถานะ</label><select id="sw-v-status" class="swal2-select !m-0 !w-full !text-xs">' + stOptions + '</select></div>' +
          '<div><label class="block text-slate-500 mb-0.5">ข้อมูลเยี่ยม / อาการ / การช่วยเหลือ</label><textarea id="sw-v-note" rows="3" class="swal2-textarea !m-0 !w-full !text-xs !h-auto" placeholder="พิมพ์ผลการเยี่ยม...">' + escapeHtml(p.Visit_Note || '') + '</textarea></div>' +
          '<div><label class="block text-slate-500 mb-0.5">แนบภาพประกอบ (สูงสุด 10 ภาพ)</label>' +
          '<input id="sw-v-photos" type="file" accept="image/*" capture="environment" multiple class="w-full text-xs border border-slate-200 rounded-lg p-2 bg-slate-50">' +
          '<div id="sw-v-photo-count" class="text-[11px] text-[#007a3d] mt-1"></div></div>' +
          '</div>',
        showCancelButton: true,
        confirmButtonText: navigator.onLine ? 'บันทึกและอัปโหลด' : '💾 บันทึกออฟไลน์',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#007a3d',
        didOpen: function() {
          var inp = document.getElementById('sw-v-photos');
          var cnt = document.getElementById('sw-v-photo-count');
          if (inp && cnt) {
            inp.addEventListener('change', function() {
              var n = inp.files ? inp.files.length : 0;
              cnt.textContent = n > 10 ? 'เลือก ' + n + ' ภาพ (บันทึกเฉพาะ 10 ภาพแรก)' : (n > 0 ? 'เลือกแล้ว ' + n + ' / 10 ภาพ' : '');
            });
          }
        },
        preConfirm: function() {
          var files = document.getElementById('sw-v-photos').files;
          var selected = [];
          for (var i = 0; i < Math.min(files.length, 10); i++) {
            selected.push(compressImageFile(files[i], 900, 0.65));
          }
          return Promise.all(selected).then(function(b64List) {
            return {
              status: document.getElementById('sw-v-status').value,
              note: document.getElementById('sw-v-note').value,
              images: b64List,
              visitExtra: {
                birthDate: document.getElementById('sw-v-dob').value.trim(),
                cid: document.getElementById('sw-v-cid').value.trim(),
                bp: document.getElementById('sw-v-bp').value.trim(),
                weight: document.getElementById('sw-v-weight').value.trim(),
                height: document.getElementById('sw-v-height').value.trim()
              }
            };
          });
        }
      }).then(function(result) {
        if (result.isConfirmed && result.value) {
          if (!navigator.onLine) {
            queueVisitOffline(p, result.value);
            return;
          }
          Swal.fire({ title: 'กำลังบันทึกและอัปโหลดรูป...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
          callApi('updatePatientVisit', {
            passcode: ADMIN_PASSCODE,
            patientId: p.Patient_ID,
            visitStatus: result.value.status,
            visitNote: result.value.note,
            images: result.value.images,
            visitExtra: result.value.visitExtra
          }, function(res) {
            Swal.fire(res && res.success ? 'สำเร็จ' : 'ผิดพลาด', (res && res.message) || '', res && res.success ? 'success' : 'error');
            if (res && res.success) refreshData();
          }, function() {
            Swal.close();
            queueVisitOffline(p, result.value);
          });
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      updateNetBadge();
      window.addEventListener('online', function() {
        updateNetBadge();
        var q = getOfflineQueue();
        if (q.length) {
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'กลับมาออนไลน์แล้ว มี ' + q.length + ' เคสรอซิงค์', timer: 3500, showConfirmButton: false });
        }
      });
      window.addEventListener('offline', updateNetBadge);

      document.getElementById('form-login').addEventListener('submit', doLogin);
      document.getElementById('btn-add-patient').addEventListener('click', function() { openEditPatientById(null); });
      document.getElementById('btn-refresh').addEventListener('click', refreshData);
      document.getElementById('btn-logout').addEventListener('click', function() {
        ADMIN_PASSCODE = '';
        ADMIN_DATA = null;
        document.getElementById('sec-app').classList.add('hidden');
        document.getElementById('sec-login').classList.remove('hidden');
      });
      document.getElementById('filter-round').addEventListener('change', function() { populateRounds(); renderPatients(); });
      document.getElementById('filter-search').addEventListener('input', renderPatients);
      document.getElementById('filter-level').addEventListener('change', renderPatients);
      document.getElementById('btn-sort-nearest').addEventListener('click', toggleSortNearest);
      document.getElementById('btn-sort-custom').addEventListener('click', toggleCustomSort);
      document.getElementById('btn-sync-all').addEventListener('click', syncAllOffline);

      var stBtns = document.querySelectorAll('.st-filter-btn');
      for (var i = 0; i < stBtns.length; i++) {
        (function(btn) {
          btn.addEventListener('click', function() {
            STATUS_FILTER = btn.getAttribute('data-st') || 'ALL';
            for (var j = 0; j < stBtns.length; j++) {
              stBtns[j].className = 'st-filter-btn rounded-xl border border-slate-200 bg-slate-50 text-slate-700 py-1.5 text-xs font-medium cursor-pointer';
            }
            btn.className = 'st-filter-btn rounded-xl border border-green-600 bg-[#007a3d] text-white py-1.5 text-xs font-medium cursor-pointer';
            renderPatients();
          });
        })(stBtns[i]);
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').catch(function() {});
        });
      }
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        DEFERRED_INSTALL_PROMPT = e;
        var b = document.getElementById('btn-pwa-install');
        if (b) b.classList.remove('hidden');
      });
      document.getElementById('btn-pwa-install').addEventListener('click', function() {
        if (!DEFERRED_INSTALL_PROMPT) return;
        DEFERRED_INSTALL_PROMPT.prompt();
        DEFERRED_INSTALL_PROMPT.userChoice.then(function() {
          DEFERRED_INSTALL_PROMPT = null;
          document.getElementById('btn-pwa-install').classList.add('hidden');
        });
      });
    });
  </script>
</body>
</html>
